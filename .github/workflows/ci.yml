name: CI

on:
  push:
    branches: [main, 33-build-the-service-images-in-ci-and-push-them-to-ghcr]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - status-page

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            services/${{ matrix.service }}/requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Test ${{ matrix.service }}
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt
          cd services/${{ matrix.service }} && pytest

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Automatically installs ansible-core too
      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check (ansible-playbook)
        run: ansible-playbook --syntax-check ansible/playbook.yml

      - name: Lint (ansible-lint)
        run: ansible-lint ansible/playbook.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Display ShellCheck version
        run: shellcheck --version

      - name: Check every sh file with ShellCheck
        run: git ls-files '*.sh' | xargs -r shellcheck

  images:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - status-page

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/33-build-the-service-images-in-ci-and-push-them-to-ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/33-build-the-service-images-in-ci-and-push-them-to-ghcr' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
