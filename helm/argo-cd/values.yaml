# Values for the Argo CD Helm chart on the local k3d cluster.
# Only overrides of the chart defaults live here; see README, "GitOps with Argo CD".

# Dex provides SSO through external identity providers; this project has none
# and logs in with the built-in admin account.
dex:
  enabled: false

# No notification channels (Slack, e-mail, ...) are configured, so the
# notifications controller would run without anything to do.
notifications:
  enabled: false

configs:
  params:
    # The UI is reached only through a kubectl port-forward, so argocd-server
    # serves plain HTTP instead of HTTPS with a self-signed certificate.
    server.insecure: true
