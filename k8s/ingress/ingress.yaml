apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: km1
  name: ingress
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: status-page
            port:
              name: http
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              name: http
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              name: http
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              name: http
