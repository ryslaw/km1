# https://kubernetes.io/docs/concepts/services-networking/ingress/#the-ingress-resource

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: km1
  name: ingress
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: http
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: http
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: http