apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: km1
  labels:
    app.kubernetes.io/part-of: km1
spec:
  selector:
    app: status-page
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: km1
spec:
  selector:
    matchLabels:
      app: status-page
  replicas: 1
  template:
    metadata:
      labels:
        app: status-page
    spec:
      containers:
        - name: status-page
          image: ghcr.io/ryslaw/km1/status-page:7e81e5935d0a2dfc49d692fbc7214fab1f6d5c3a
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: "/health"
              port: http
          livenessProbe:
            httpGet:
              path: "/health"
              port: http
      imagePullSecrets:
        - name: package-read
