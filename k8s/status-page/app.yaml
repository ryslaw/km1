apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: km1
spec:
  selector:
    app: status-page
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: km1
spec:
  selector:
    matchLabels:
      app: status-page
  replicas: 1
  template:
    metadata:
      labels:
        app: status-page
    spec:
      containers:
        - name: status-page
          image: km1/status-page:local
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: "/health"
              port: http
          livenessProbe:
            httpGet:
              path: "/health"
              port: http
