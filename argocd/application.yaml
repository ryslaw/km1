apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: km1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:ryslaw/km1.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      # The km1 namespace stays out of Argo CD: it is created by hand before
      # the Secrets inside it, and pruning it or deleting the Application with
      # cascade would delete the Secrets and the database volumes with it.
      exclude: 00-namespace.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: km1
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
