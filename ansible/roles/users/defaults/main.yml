---
# Role groups (supplementary groups, not system ones), created before the accounts.
# users_groups:
#   - role_group1
#   - role_group2
users_groups: []

# Accounts managed by this role. All fields are required.
#   name            login name
#   groups          full list of supplementary groups; the account is removed from any group not listed,
#                   and the primary group (same name as the login) is created automatically
#   ssh_public_key  the only key allowed to log in; any other key in authorized_keys is removed
#
# Every group must already exist: either a system group or one listed in users_groups.
# Passwords are locked, so the accounts log in with their SSH key only.
# Accounts not listed here are left untouched
#
# users_accounts:
#   - name: jdoe
#     groups: ["adm", "role_group1"]
#     ssh_public_key: "ssh-ed25519 XYZ...XYZ jdoe@..."
users_accounts: []
