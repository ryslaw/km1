services:
    user-service:
        build: services/user-service
        depends_on:
            user-service-db:
                condition: service_healthy
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@user-service-db:5432/user-service-db"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    user-service-db:
        image: postgres:18.6
        container_name: user-service-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: user-service-db
        volumes:
            - user-service-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 30s

    product-service:
        build: services/product-service
        depends_on:
            product-service-db:
                condition: service_healthy
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@product-service-db:5432/product-service-db"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    product-service-db:
        image: postgres:18.6
        container_name: product-service-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: product-service-db
        volumes:
            - product-service-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 30s

    order-service:
        build: services/order-service
        depends_on:
            order-service-db:
                condition: service_healthy
            user-service:
                condition: service_healthy
            product-service:
                condition: service_healthy
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-service-db:5432/order-service-db"
            USER_SERVICE_URL: "http://user-service:8000"
            PRODUCT_SERVICE_URL: "http://product-service:8000"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    order-service-db:
        image: postgres:18.6
        container_name: order-service-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: order-service-db
        volumes:
            - order-service-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 30s

    status-page:
        build: services/status-page
        ports: 
            - "8000:8000"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    user-service-db-data:
    product-service-db-data:
    order-service-db-data: