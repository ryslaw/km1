x-healthcheck-app: &healthcheck-app
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

x-healthcheck-db: &healthcheck-db
    interval: 5s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
    user-service:
        build: services/user-service
        ports:
            - "8001:8000"
        depends_on:
            user-service-db:
                condition: service_healthy
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER:?copy .env.example to .env first}:${POSTGRES_PASSWORD:?copy .env.example to .env first}@user-service-db:5432/user-service-db"
        healthcheck:
            <<: *healthcheck-app

    user-service-db:
        image: postgres:18.6
        container_name: user-service-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env first}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
            POSTGRES_DB: user-service-db
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - user-service-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?copy .env.example to .env first} -d user-service-db"]
            <<: *healthcheck-db

    product-service:
        build: services/product-service
        ports:
            - "8002:8000"
        depends_on:
            product-service-db:
                condition: service_healthy
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER:?copy .env.example to .env first}:${POSTGRES_PASSWORD:?copy .env.example to .env first}@product-service-db:5432/product-service-db"
        healthcheck:
            <<: *healthcheck-app

    product-service-db:
        image: postgres:18.6
        container_name: product-service-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env first}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
            POSTGRES_DB: product-service-db
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - product-service-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?copy .env.example to .env first} -d product-service-db"]
            <<: *healthcheck-db

    order-service:
        build: services/order-service
        ports:
            - "8003:8000"
        depends_on:
            order-service-db:
                condition: service_healthy
            user-service:
                condition: service_healthy
            product-service:
                condition: service_healthy
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER:?copy .env.example to .env first}:${POSTGRES_PASSWORD:?copy .env.example to .env first}@order-service-db:5432/order-service-db"
            USER_SERVICE_URL: "http://user-service:8000"
            PRODUCT_SERVICE_URL: "http://product-service:8000"
        healthcheck:
            <<: *healthcheck-app

    order-service-db:
        image: postgres:18.6
        container_name: order-service-db
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env first}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
            POSTGRES_DB: order-service-db
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - order-service-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?copy .env.example to .env first} -d order-service-db"]
            <<: *healthcheck-db

    status-page:
        build: services/status-page
        ports: 
            - "8000:8000"
        healthcheck:
            <<: *healthcheck-app

volumes:
    user-service-db-data:
    product-service-db-data:
    order-service-db-data: